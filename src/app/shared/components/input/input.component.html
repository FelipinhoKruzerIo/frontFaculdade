<div class="tw-w-full">
  <label *ngIf="label" for="{{ name }}"
    ><p>{{ label }}</p></label
  >
  <input
    id="{{ name }}"
    name="{{ name }}"
    [ngClass]="hasError && touched ? 'tw-border !tw-border-error-20' : ''"
    class="tw-w-full tw-text-base tw-font-inter tw-border tw-border-grey-light-20 !tw-bg-white tw-px-2 tw-text-dark-blue-50 tw-py-1 tw-rounded-md"
    type="{{ type }}"
    [value]="value"
    (input)="updateValue($event)"
    (blur)="onTouched()"
    placeholder="{{ placeholder }}"
    autocomplete="on"
  />
</div>
